      <stop offset="1" stop-color="#050a18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f3efe0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f3efe0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="700" fill="url(#sky)"/>
