<?xml version="1.0" encoding="UTF-8"?>
<!-- Ambient Home's start-up picture (appinfo.json splashBackground), shown by LG's start-up cover while it loads.
     The wordmark is added in Outfit Light when splash.png is made:
     magick prototype/splash.svg -font prototype/fonts/outfit-300.ttf -pointsize 112 -kerning 2 -fill "#f3efe4" \
       -gravity center -annotate +0-150 "Ambient Home" prototype/splash.png -->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
